[PHP]
extension_dir = "${ST_ROOT}\php\ext"
variables_order = "EGPCS"
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 100M
post_max_size = 100M
expose_php = Off
display_errors = Off
log_errors = On
cgi.fix_pathinfo = 1
date.timezone = UTC

extension = curl
extension = exif
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_mysql
extension = pdo_pgsql
extension = pdo_sqlite
extension = sockets
extension = sodium
extension = sqlite3
extension = zip
zend_extension = opcache

[curl]
curl.cainfo = "${ST_ROOT}\cacert.pem"

[openssl]
openssl.cafile = "${ST_ROOT}\cacert.pem"

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
